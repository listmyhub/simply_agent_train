[project]
name = "agent"
version = "0.1.0"
description = "创建一个联网搜索的新agent"
readme="readme.md"
requires-python=">=3.10"
dependencies=[
    "langchain>=1.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev=["mypy>=1.1.0","ruff>=0.6.1"]



[build-system]
requires = ["setuptools>=73.0.0","wheel"]
build-backend = "setuptools.build_meta"
